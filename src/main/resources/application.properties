spring.application.name=sonidovivo
server.port=8080

# Conexión a MySQL (crear antes la base: CREATE DATABASE bd_sonidovivo;)
spring.datasource.url=jdbc:mysql://localhost:3306/bd_sonidovivo
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (la clave debe tener al menos 32 caracteres; cámbiala en un entorno real)
jwt.secret=sonido-vivo-clave-secreta-para-firmar-los-tokens-jwt-2026
jwt.expiration-ms=7200000
