spring.application.name=sonidovivo
server.port=8080

# Los secretos NO van en este archivo (se sube a GitHub). Se leen desde:
#   1) el archivo local secrets.properties (ignorado por git; ver secrets.properties.example), o
#   2) variables de entorno (DB_PASSWORD, JWT_SECRET, ...)
spring.config.import=optional:file:./secrets.properties

# Conexión a MySQL (crear antes la base: CREATE DATABASE bd_sonidovivo;)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_sonidovivo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT: la clave (mínimo 32 caracteres) es obligatoria y no tiene valor por defecto a propósito
jwt.secret=${JWT_SECRET}
# Vigencia de cada token: 2 horas
jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}
# Duración máxima de una sesión aunque se renueve el token: 8 horas
jwt.max-session-ms=${JWT_MAX_SESSION_MS:28800000}

# Orígenes permitidos por CORS (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
